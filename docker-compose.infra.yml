services:
  mariadb:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-procurement}
      MARIADB_USER: ${DB_USERNAME:-procurement}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  gotenberg:
    # Chromium-only variant: this app only converts HTML, so the LibreOffice
    # payload in the full image is pure weight on disk and on pull time.
    image: gotenberg/gotenberg:8-chromium
    ports:
      # Gotenberg has no authentication — keep it off the LAN; only processes
      # on this host (artisan serve, the dev API) may reach it.
      - "127.0.0.1:3005:3000"
    command:
      - gotenberg
      # Warm Chromium at boot so the first print of the day doesn't pay the
      # cold start.
      - --chromium-auto-start=true
      # The print blades are static HTML — no script to run, so don't pay
      # for a JS runtime per render.
      - --chromium-disable-javascript=true
      # Two renders at a time: the default of six concurrent Chromium
      # contexts is what makes the container spike into multi-GB territory.
      - --chromium-max-concurrency=2
      # Fail cleanly before the PHP client's 30s abort and the 60s
      # `telegram` queue timeout — otherwise both sides race and the error
      # body is lost.
      - --api-timeout=25s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb_data:
  redis_data:
  meilisearch_data:
  minio_data:
