name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: procurement_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: procurement_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, gd, zip, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Pint (code style)
        run: composer pint:test

      - name: PHPStan (static analysis)
        run: composer stan

      - name: deptrac (module boundaries)
        run: composer deptrac

      - name: Pest (tests, real MariaDB)
        run: php artisan test --parallel

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build
        run: pnpm --filter web build

      - name: Generated client is up to date
        run: git diff --exit-code -- apps/web/src/lib/api || (echo "::error::Orval client is stale — regenerate with 'pnpm generate-client' and commit" && exit 1)
